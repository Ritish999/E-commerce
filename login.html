<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hamro Storee | Sign In</title>

  <link rel="stylesheet" href="login.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;900&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <section class="left">

    <div class="left-accent"></div>

    <div class="left-content">

      <div class="tag">
        Welcome Back
      </div>

      <h2>
        SIGN<br>
        <span>IN</span>
      </h2>

      <p>
        Welcome back to Hamro Storee.
        Sign in to explore our latest collections
        and continue shopping.
      </p>

    </div>

  </section>


  <main class="right">

    <div class="form-title">
      Sign <span>In</span>
    </div>

    <p class="form-sub">
      New here?
      <a href="signup.html">Create an account</a>
    </p>


    <div class="input-group">

      <label for="username">
        Username
      </label>

      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        autocomplete="username"
      >

    </div>


    <div class="input-group">

      <label for="password">
        Password
      </label>

      <div class="pw-row">

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

        <button
          class="pw-toggle"
          id="toggleButton"
          type="button"
          onclick="togglePw()"
        >
          Show
        </button>

      </div>

    </div>


    <button
      class="btn-signin"
      type="button"
      onclick="login()"
    >
      Sign In
      <span>&rarr;</span>
    </button>

  </main>


  <script src="login.js"></script>

</body>

</html>
