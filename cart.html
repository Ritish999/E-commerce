
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart</title>

    <link rel="stylesheet" href="ecomm.css">

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet">
</head>

<body>

    <header class="second_box">

        <div class="logo">
            <a href="ecomm.html">
                <img src="logo.jpeg" height="60" alt="Logo">
            </a>
        </div>

        <nav class="titles">
            <a href="men.html">MEN</a>
            <a href="women.html">WOMEN</a>
            <a href="gear.html">GEAR</a>
            <a href="workwear.html">WORKWEAR</a>
            <a href="crew.html">CREW STORE</a>
        </nav>

        <div class="right_section">

            <a href="#">
                <i class="ri-search-line" style="font-size:30px"></i>
            </a>

            <a href="login.html">
                <i class="ri-user-line" style="font-size:30px"></i>
            </a>

            <a href="cart.html">
                <i class="ri-shopping-cart-2-line" style="font-size:30px"></i>
            </a>

        </div>

    </header>


    <div class="cart-page">

        <h1>YOUR CART</h1>

        <div class="cart-container">

            <div class="cart-items" id="cartItems">
            </div>


            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rs 0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span>Free</span>
                </div>

                <hr>

                <div class="total">
                    <span>Total</span>
                    <span id="total">Rs 0</span>
                </div>

                <button class="checkout" onclick="checkout()">
                    Proceed to Checkout
                </button>

                <a href="ecomm.html" class="continue">
                    Continue Shopping
                </a>

            </div>

        </div>

    </div>


    <footer>
        © 2026 Fashion Store | Stylish Bags Collection
    </footer>


    <script src="cart.js"></script>

</body>

</html>
